[tool.poetry]
name = "supercondtorgnn"
version = "1.0.0"
description = "Advanced Graph Neural Network for predicting superconductor critical temperature (Tc)"
authors = ["Parker Ryan <parker.ryan@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "supercondtorgnn"}]

[tool.poetry.dependencies]
python = "^3.7"
torch = "^2.0.0"
torch-geometric = "^2.3.0"
pymatgen = "^2023.0.0"
mp-api = "^0.30.0"
numpy = "^1.21.0"
pandas = "^1.3.0"
scikit-learn = "^0.24.0"
requests = "^2.26.0"
ase = "^3.22.0"
matplotlib = "^3.4.0"
seaborn = "^0.11.0"
tqdm = "^4.62.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^3.0"
black = "^22.0"
flake8 = "^4.0"
mypy = "^0.950"
jupyter = "^1.0"
ipython = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
